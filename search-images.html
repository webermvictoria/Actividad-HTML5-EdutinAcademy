<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Búsquedas en Google Imágenes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="home-link" href="index.html">Página principal</a>

    <main class="search-container">
        <div class="logo-crop">
            <img src="google.png" alt="Logo de Google">
        </div>

         <form action="https://www.google.com/search"
          method="GET"
          target="_blank">

        <input 
            type="text"
            name="q"
            placeholder="¿Qué imágen buscas?"
            required
        >

        <input type="hidden" name="tbm" value="isch">

        <button type="submit">Buscar imágenes</button>

    </form>

    </main>

</body>
</html>
