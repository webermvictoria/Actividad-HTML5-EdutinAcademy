
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Búsquedas en Google</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="search-container">
        <div class="logo-crop">
            <img src="google.png" alt="Logo de Google">
        </div>

        <form action="https://www.google.com/search" method="get">
            <input type="text" name="q" placeholder="Buscar en Google">
            <button type="submit">Buscar</button>
            <button id="lucky-button" type="submit" name="btnI" value="1">Me siento afortunado</button>
        </form>
    </main>

</body>
</html>
